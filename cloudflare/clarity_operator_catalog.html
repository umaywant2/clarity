    <style>
      * { scrollbar-width: thin; scrollbar-color: #1e2535 #0a0c12; }

      ::-webkit-scrollbar-thumb:hover { background: #2a3247; }

      .op-card { transition: all 0.2s ease; border: 1px solid #1e2535; }
      .op-card:hover { border-color: #2a3247; transform: translateY(-1px); box-shadow: 0 4px 24px rgba(0,0,0,0.3); }

      .detail-panel { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease; }
      .detail-panel.closed { transform: translateX(100%); opacity: 0; pointer-events: none; }
      .detail-panel.open { transform: translateX(0); opacity: 1; }

      .graph-panel { transition: width 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease; overflow: hidden; }
      .graph-panel.collapsed { width: 0 !important; opacity: 0; padding: 0 !important; border: none !important; }
      .graph-panel.expanded { width: 280px; opacity: 1; }

      .filter-chip:hover { opacity: 0.9; }
      .filter-chip.active { box-shadow: 0 0 0 1px currentColor; }

      .layer-dot { width: 10px; height: 10px; border-radius: 50%; transition: all 0.15s ease; }
      .layer-dot.filled { opacity: 1; }
      .layer-dot.empty { opacity: 0.15; }

      .sidebar-item { transition: all 0.15s ease; cursor: pointer; }
      .sidebar-item:hover { background: #161b2a; }
      .sidebar-item.active { background: #161b2a; border-right: 2px solid; }

      .tab-btn { transition: all 0.15s ease; }
      .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #e2e8f0; }

      .status-stable { background: rgba(16,185,129,0.15); color: #34d399; }
      .status-experimental { background: rgba(139,92,246,0.15); color: #a78bfa; }
      .status-deprecated { background: rgba(239,68,68,0.15); color: #f87171; }
      .status-draft { background: rgba(100,116,139,0.15); color: #94a3b8; }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in { animation: fadeIn 0.2s ease forwards; }

      .substrate-tag { font-size: 0.65rem; padding: 1px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-weight: 500; }

      svg text { font-family: 'Inter', sans-serif; }

      .mobile-sidebar { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
      .mobile-sidebar.hidden-mobile { transform: translateX(-100%); }
    </style>
</head>

    // ============================================================
    // STATE
    // ============================================================
    const RTT_PROFILES = ['ALL','SIGNAL','SEMANTIC','STRUCTURAL','TEMPORAL','MODAL','COMPOSITE'];
    const STATUSES = ['ALL','STABLE','EXPERIMENTAL','DEPRECATED','DRAFT'];
    const SUBSTRATES = ['TEXT','VECTOR','GRAPH','STREAM','SCHEMA','TENSOR'];
    const LAYERS = ['L0','L1','L2','L3','L4','L5'];
    const CLASSES = ['ALL','LENS','FILTER','RESOLVE','TRACE','MAP','DIFF','SYNC','GATE','ANCHOR','WEAVE'];
    const CLASS_COUNTS = {};
    OPERATORS.forEach(op => { CLASS_COUNTS[op.class] = (CLASS_COUNTS[op.class]||0)+1; });

    let state = {
        search: '',
        activeClass: 'ALL',
        activeRTT: 'ALL',
        activeStatus: 'ALL',
        activeSubstrates: [],
        activeLayers: [],
        selectedOp: null,
        graphOpen: false,
    };

    // ============================================================
    // FILTER LOGIC
    // ============================================================
    function filterOperators() {
        return OPERATORS.filter(op => {
            if (state.activeClass !== 'ALL' && op.class !== state.activeClass) return false;
            if (state.activeRTT !== 'ALL' && op.rttProfile !== state.activeRTT) return false;
            if (state.activeStatus !== 'ALL' && op.status !== state.activeStatus) return false;
            if (state.activeSubstrates.length > 0 && !state.activeSubstrates.every(s => op.substrateProfile.includes(s))) return false;
            if (state.activeLayers.length > 0 && !state.activeLayers.every(l => op.analyzerLayer.includes(l))) return false;
            if (state.search) {
                const q = state.search.toLowerCase();
                const searchable = [op.id, op.name, op.description, op.module, op.rttProfile, op.class, ...op.tags, ...op.inputs.map(i=>i.name+' '+i.type), ...op.outputs.map(o=>o.name+' '+o.type)].join(' ').toLowerCase();
                if (!searchable.includes(q)) return false;
            }
            return true;
        });
    }

        // Status

        }).join('');
        statusCont.querySelectorAll('.filter-chip').forEach(el => {

        // Substrate

    // ============================================================
    // MODULE GRAPH (SVG)
    // ============================================================
    function renderModuleGraph() {
        const svg = document.getElementById('module-graph');
        const legend = document.getElementById('graph-legend');
        const classes = Object.keys(CLASS_COLORS);
        const cx = 130, cy = 130, r = 100;
        const positions = {};
        classes.forEach((cls, i) => {
            const angle = (i / classes.length) * 2 * Math.PI - Math.PI/2;
            positions[cls] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
        });

        // Build cross-ref edges between classes
        const edgeMap = {};
        OPERATORS.forEach(op => {
            op.crossRefs.forEach(ref => {
                const target = OPERATORS.find(o => o.id === ref);
                if (target && op.class !== target.class) {
                    const key = [op.class, target.class].sort().join('-');
                    edgeMap[key] = (edgeMap[key]||0) + 1;
                }
            });
        });

        let svgContent = '';
        // Edges
        Object.entries(edgeMap).forEach(([key, count]) => {
            const [a, b] = key.split('-');
            const pa = positions[a], pb = positions[b];
            const opacity = Math.min(0.15 + count * 0.03, 0.5);
            svgContent += `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="#2a3247" stroke-width="${Math.min(1 + count*0.3, 3)}" stroke-opacity="${opacity}"/>`;
        });
        // Nodes
        classes.forEach(cls => {
            const p = positions[cls];
            svgContent += `<circle cx="${p.x}" cy="${p.y}" r="16" fill="${CLASS_COLORS[cls]}22" stroke="${CLASS_COLORS[cls]}" stroke-width="1.5" class="cursor-pointer graph-node" data-class="${cls}"/>`;
            svgContent += `<text x="${p.x}" y="${p.y+1}" text-anchor="middle" dominant-baseline="middle" fill="${CLASS_COLORS[cls]}" font-size="7" font-weight="600" class="pointer-events-none" style="font-family:'JetBrains Mono',monospace">${cls.substring(0,3)}</text>`;
        });
        svg.innerHTML = svgContent;

        // Legend
        legend.innerHTML = classes.map(cls => `<div class="flex items-center gap-2 text-[10px] graph-legend-item cursor-pointer hover:opacity-80" data-class="${cls}"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${CLASS_COLORS[cls]}"></span><span class="text-txt-300 font-mono">${cls}</span><span class="text-txt-500">(${CLASS_COUNTS[cls]})</span></div>`).join('');

        // Click handlers
        svg.querySelectorAll('.graph-node').forEach(node => {
            node.addEventListener('click', () => { state.activeClass = node.dataset.class; render(); });
        });
        legend.querySelectorAll('.graph-legend-item').forEach(item => {
            item.addEventListener('click', () => { state.activeClass = item.dataset.class; render(); });
        });
    }

    // ============================================================
    // MOBILE SIDEBAR
    // ============================================================
    function openMobileSidebar() {
        document.getElementById('sidebar').classList.remove('hidden-mobile');
        document.getElementById('sidebar-overlay').classList.remove('hidden');
    }
    function closeMobileSidebar() {
        document.getElementById('sidebar').classList.add('hidden-mobile');
        document.getElementById('sidebar-overlay').classList.add('hidden');
    }

    // ============================================================
    // MAIN RENDER
    // ============================================================
    function render() {
        const filtered = filterOperators();
        renderSidebar();
        renderFilterBar();
        renderStatsBar(filtered);
        renderGrid(filtered);
    }

    // ============================================================
    // INIT
    // ============================================================
    if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
        lucide.createIcons();
    }

    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
        state.search = e.target.value;
        render();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDetail();
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('search-input').focus();
        }
    });

    // Detail overlay click to close
    document.getElementById('detail-overlay').addEventListener('click', closeDetail);

    // Graph toggle
    document.getElementById('graph-toggle-btn').addEventListener('click', () => {
        const panel = document.getElementById('graph-panel');
        state.graphOpen = !state.graphOpen;
        if (state.graphOpen) {
            panel.classList.remove('collapsed');
            panel.classList.add('expanded');
        } else {
            panel.classList.add('collapsed');
            panel.classList.remove('expanded');
        }
    });
    document.getElementById('graph-close-btn').addEventListener('click', () => {
        const panel = document.getElementById('graph-panel');
        state.graphOpen = false;
        panel.classList.add('collapsed');
        panel.classList.remove('expanded');
    });

    // Clear all filters
    document.addEventListener('click', (e) => {
        if (e.target.id === 'clear-all-btn') {
            state.search = '';
            state.activeClass = 'ALL';
            state.activeRTT = 'ALL';
            state.activeStatus = 'ALL';
            state.activeSubstrates = [];
            state.activeLayers = [];
            document.getElementById('search-input').value = '';
            render();
        }
    });

    // Mobile sidebar
    document.getElementById('mobile-sidebar-btn').addEventListener('click', openMobileSidebar);
    document.getElementById('mobile-sidebar-close').addEventListener('click', closeMobileSidebar);
    document.getElementById('sidebar-overlay').addEventListener('click', closeMobileSidebar);

    // Initial render
    render();
    renderModuleGraph();
    </script>
</body>
</html>
